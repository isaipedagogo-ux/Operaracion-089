}, {"id": 113, "text": "Código del resultado de la Operación: \"01\" (Aceptado)"}, {"id": 114, "text": "Diagnóstico del Proceso: \"00\" (Sin observaciones)"}, {"id": 115, "text": "Tipo de Baja: \"1\" (Baja ordinaria)"}]}, {"title": "Interpretación", "rows": [{"id": 116, "text": "Interpretación:"}, {"id": 117, "text": "La operación 089 notifica a la AFORE el resultado de las solicitudes enviadas en la operación 080. En este ejemplo, la baja del Asesor Previsional fue aceptada y procesada correctamente."}, {"id": 118, "text": "Este formato se utiliza para comunicar los resultados de todas las solicitudes (altas, bajas, actualizaciones, recertificaciones) y es fundamental para el seguimiento y control de los movimientos de Asesores Previsionales."}]}];let current=0;const nav=document.getElementById('nav'),view=document.getElementById('slide'),count=document.getElementById('count'),progress=document.getElementById('progress');function el(tag,cls,text){const n=document.createElement(tag);if(cls)n.className=cls;if(text!==undefined)n.textContent=text;return n;}slides.forEach((s,i)=>{const b=el('button','');b.append(el('b','',String(i+1).padStart(2,'0')),el('span','',s.title));b.onclick=()=>show(i);nav.append(b)});function show(index){current=Math.min(slides.length-1,Math.max(0,index));const s=slides[current];view.replaceChildren();const a=el('div','accent');const title=el('h2','',s.title);view.append(a,title);s.rows.forEach((r,j)=>{let cls='entry';if(j===0 && (s.rows.length===1 || s.rows.length>1 && r.text.length>90))cls+=' lead';else if(j===0 && s.rows.length>1)cls+=' heading';else cls+=' item';view.append(el('div',cls,r.text))});view.scrollTop=0;view.classList.remove('fade');void view.offsetWidth;view.classList.add('fade');count.textContent=`${String(current+1).padStart(2,'0')} / ${String(slides.length).padStart(2,'0')}`;progress.style.width=((current+1)/slides.length*100)+'%';[...nav.children].forEach((b,i)=>{b.classList.toggle('active',i===current);b.setAttribute('aria-current',i===current?'step':'false')});document.getElementById('back').disabled=current===0;document.getElementById('next').disabled=current===slides.length-1;}document.getElementById('back').onclick=()=>show(current-1);document.getElementById('next').onclick=()=>show(current+1);document.addEventListener('keydown',e=>{if(['INPUT','TEXTAREA'].includes(document.activeElement.tagName))return;if(e.key==='ArrowRight')show(current+1);if(e.key==='ArrowLeft')show(current-1)});show(0);
